<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="ttl desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ttl">FillingLens architecture</title>
<desc id="desc">Ingestion pipeline: browser upload, FastAPI job, background parse, chunk and embed into Supabase pgvector. Query pipeline: embed question, vector search top 5, Groq generation, grounding validation, streamed answer.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#475569"/></marker>
<style>
text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:15px;font-weight:700;fill:#14213D}
.s{font-size:13px;fill:#4A5568}
.nt{font-size:14px;font-weight:700;fill:#14213D}
.lane{font-size:15px;font-weight:700;fill:#14213D}
.a{stroke:#475569;stroke-width:2;fill:none}
.lbl{font-size:12px;fill:#475569}
</style>
</defs>
<rect x="1" y="1" width="1198" height="738" rx="16" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="2"/>
<text x="60" y="48" style="font-size:26px;font-weight:800;fill:#14213D">FillingLens architecture</text>
<text x="60" y="72" style="font-size:14px;fill:#4A5568">Ingestion runs in the background. Every answer is validated before it reaches the user.</text>
<rect x="640" y="32" width="16" height="16" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="662" y="45" class="s">Browser</text>
<rect x="735" y="32" width="16" height="16" rx="4" fill="#EAF1FD" stroke="#2F6FDE" stroke-width="1.5"/><text x="757" y="45" class="s">FastAPI</text>
<rect x="830" y="32" width="16" height="16" rx="4" fill="#EFEBFE" stroke="#7C5CFA" stroke-width="1.5"/><text x="852" y="45" class="s">Gemini</text>
<rect x="920" y="32" width="16" height="16" rx="4" fill="#FFF6DB" stroke="#C9930A" stroke-width="1.5"/><text x="942" y="45" class="s">Groq</text>
<rect x="1000" y="32" width="16" height="16" rx="4" fill="#E3F4F1" stroke="#0F766E" stroke-width="1.5"/><text x="1022" y="45" class="s">Supabase</text>
<text x="60" y="102" class="lane">Ingestion (async)</text>
<rect x="468" y="112" width="404" height="116" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="482" y="129" class="lbl">BackgroundTask</text>
<rect x="60" y="136" width="170" height="80" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="145.0" y="164" text-anchor="middle" class="t">Browser</text>
<text x="145.0" y="185" text-anchor="middle" class="s">React, Vite, Tailwind</text>
<text x="145.0" y="202" text-anchor="middle" class="s">Upload PDF + auth token</text>
<rect x="270" y="136" width="170" height="80" rx="10" fill="#EAF1FD" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="355.0" y="164" text-anchor="middle" class="t">FastAPI</text>
<text x="355.0" y="185" text-anchor="middle" class="s">Returns job_id at once</text>
<text x="355.0" y="202" text-anchor="middle" class="s">Starts BackgroundTask</text>
<rect x="480" y="136" width="170" height="80" rx="10" fill="#EAF1FD" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="565.0" y="164" text-anchor="middle" class="t">Parse and chunk</text>
<text x="565.0" y="185" text-anchor="middle" class="s">pypdf, BeautifulSoup</text>
<text x="565.0" y="202" text-anchor="middle" class="s">LangChain splitter</text>
<rect x="690" y="136" width="170" height="80" rx="10" fill="#EFEBFE" stroke="#7C5CFA" stroke-width="1.5"/>
<text x="775.0" y="164" text-anchor="middle" class="t">Embed chunks</text>
<text x="775.0" y="185" text-anchor="middle" class="s">gemini-embedding-001</text>
<text x="775.0" y="202" text-anchor="middle" class="s">768-dim vectors</text>
<line x1="230" y1="176" x2="268" y2="176" class="a" marker-end="url(#ah)"/>
<line x1="440" y1="176" x2="478" y2="176" class="a" marker-end="url(#ah)"/>
<line x1="650" y1="176" x2="688" y2="176" class="a" marker-end="url(#ah)"/>
<path d="M355 216 V246 H145 V222" class="a" marker-end="url(#ah)"/>
<text x="250" y="264" text-anchor="middle" class="lbl">polls job status every 1.5 s</text>
<line x1="775" y1="216" x2="775" y2="290" class="a" marker-end="url(#ah)"/>
<text x="787" y="268" class="lbl">store vectors</text>
<rect x="60" y="292" width="800" height="52" rx="10" fill="#E3F4F1" stroke="#0F766E" stroke-width="1.5"/>
<text x="460" y="314" text-anchor="middle" class="t">Supabase PostgreSQL + pgvector</text>
<text x="460" y="333" text-anchor="middle" class="s">chunks, embeddings, ingest jobs</text>
<text x="60" y="378" class="lane">Query</text>
<rect x="60" y="396" width="170" height="80" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="145.0" y="424" text-anchor="middle" class="t">Browser</text>
<text x="145.0" y="445" text-anchor="middle" class="s">Ask a question</text>
<text x="145.0" y="462" text-anchor="middle" class="s">Auth token included</text>
<rect x="270" y="396" width="170" height="80" rx="10" fill="#EFEBFE" stroke="#7C5CFA" stroke-width="1.5"/>
<text x="355.0" y="424" text-anchor="middle" class="t">Embed query</text>
<text x="355.0" y="445" text-anchor="middle" class="s">gemini-embedding-001</text>
<text x="355.0" y="462" text-anchor="middle" class="s">same vector space</text>
<rect x="480" y="396" width="170" height="80" rx="10" fill="#EAF1FD" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="565.0" y="424" text-anchor="middle" class="t">Vector search</text>
<text x="565.0" y="445" text-anchor="middle" class="s">Cosine distance (pgvector)</text>
<text x="565.0" y="462" text-anchor="middle" class="s">Top 5 chunks</text>
<rect x="690" y="396" width="170" height="80" rx="10" fill="#EAF1FD" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="775.0" y="424" text-anchor="middle" class="t">Build context</text>
<text x="775.0" y="445" text-anchor="middle" class="s">5 retrieved chunks</text>
<text x="775.0" y="462" text-anchor="middle" class="s">become the prompt context</text>
<line x1="230" y1="436" x2="268" y2="436" class="a" marker-end="url(#ah)"/>
<line x1="440" y1="436" x2="478" y2="436" class="a" marker-end="url(#ah)"/>
<line x1="650" y1="436" x2="688" y2="436" class="a" marker-end="url(#ah)"/>
<line x1="565" y1="396" x2="565" y2="346" class="a" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="577" y="373" class="lbl">similarity search</text>
<line x1="775" y1="476" x2="775" y2="540" class="a" marker-end="url(#ah)"/>
<rect x="690" y="540" width="170" height="80" rx="10" fill="#FFF6DB" stroke="#C9930A" stroke-width="1.5"/>
<text x="775.0" y="568" text-anchor="middle" class="t">Generate</text>
<text x="775.0" y="589" text-anchor="middle" class="s">Groq, gpt-oss-120b</text>
<text x="775.0" y="606" text-anchor="middle" class="s">Drafts a cited answer</text>
<rect x="440" y="540" width="210" height="80" rx="10" fill="#FDEBE3" stroke="#C2410C" stroke-width="3"/>
<text x="545.0" y="568" text-anchor="middle" class="t">Grounding Validator</text>
<text x="545.0" y="589" text-anchor="middle" class="s">Second Groq pass</text>
<text x="545.0" y="606" text-anchor="middle" class="s">Checks claims vs. chunks</text>
<rect x="60" y="540" width="340" height="80" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="230.0" y="568" text-anchor="middle" class="t">Answer + citations</text>
<text x="230.0" y="589" text-anchor="middle" class="s">Streamed to the browser</text>
<text x="230.0" y="606" text-anchor="middle" class="s">Only if grounded</text>
<line x1="688" y1="580" x2="652" y2="580" class="a" marker-end="url(#ah)"/>
<line x1="438" y1="580" x2="402" y2="580" class="a" marker-end="url(#ah)"/>
<text x="420" y="572" text-anchor="middle" class="lbl">pass</text>
<rect x="440" y="660" width="210" height="50" rx="10" fill="#FDEBE3" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="545.0" y="688" text-anchor="middle" class="t">Blocked: safety warning</text>
<text x="545.0" y="709" text-anchor="middle" class="s"></text>
<line x1="545" y1="620" x2="545" y2="658" class="a" marker-end="url(#ah)"/>
<text x="557" y="644" class="lbl">fail</text>
<line x1="900" y1="136" x2="900" y2="216" stroke="#CBD5E1" stroke-width="2"/>
<text x="914" y="152" class="nt">Why async</text>
<text x="914" y="174" class="s">A 300-page filing never</text>
<text x="914" y="192" class="s">times out the browser.</text>
<line x1="900" y1="396" x2="900" y2="476" stroke="#CBD5E1" stroke-width="2"/>
<text x="914" y="412" class="nt">Evaluation</text>
<text x="914" y="434" class="s">run_eval.py: Recall@5 and</text>
<text x="914" y="452" class="s">generation faithfulness.</text>
<text x="914" y="470" class="s">pytest: parsing, chunking.</text>
<line x1="900" y1="540" x2="900" y2="620" stroke="#CBD5E1" stroke-width="2"/>
<text x="914" y="556" class="nt">Safety layer</text>
<text x="914" y="578" class="s">Every number and claim must</text>
<text x="914" y="596" class="s">appear in the retrieved chunks.</text>
</svg>