[project]
name = "fillinglens-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samruddh Birajdar", email = "samruddh.birajdar24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.46.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "pydantic-ai-slim[google]>=2.66.0",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
fillinglens-backend = "fillinglens_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.uv]
package = false
